name: Tests

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

# The suite only reads the checkout; nothing here writes to the repo, publishes,
# or comments. Declaring it explicitly means a token leak from a dependency
# cannot push, regardless of the repository's default workflow permissions.
permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The suite runs in well under a minute locally; numba's cold JIT is the only
    # thing that could stretch it. A cap well above that ceiling turns a hang
    # into a fast red instead of a six-hour default-timeout burn.
    timeout-minutes: 20
    strategy:
      # Report every version's result, not just the first failure.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Dependencies are unpinned, so record what actually resolved. When a run
      # goes red without a corresponding source change, this is the first place
      # to look for an upstream numba/numpy/galois bump.
      - name: Record resolved environment
        run: pip list

      # --durations surfaces the slowest tests in every log, which is the raw
      # material for the wall-clock benchmarking tier if it gets added later.
      - name: Run test suite
        run: pytest -q -ra --durations=10

  # Advisory only. `gate` deliberately does not list this job in `needs`, and
  # continue-on-error keeps a red result from failing the workflow, so nothing
  # here can block a merge.
  #
  # It reports counts rather than findings on purpose: the codebase carries a
  # known backlog (~180 pyright errors in src/, a few hundred ruff hits), so a
  # full dump would be unread noise. What is worth watching is whether the
  # numbers move, which a one-line-per-directory summary makes obvious.
  quality:
    name: type-check and lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,lint]"

      # Basic mode matches .vscode/settings.json, so CI and the editor agree.
      # The script reports per-file counts rather than the findings themselves,
      # which is what makes the backlog actionable -- it says which module to
      # open. It is checked in so the same report can be produced locally:
      #   python .github/scripts/typecheck_summary.py src test
      - name: Type check (pyright, basic mode)
        continue-on-error: true
        run: python .github/scripts/typecheck_summary.py src test --limit 15

      - name: Lint (ruff)
        continue-on-error: true
        run: |
          {
            echo
            echo "## Lint (ruff), by rule"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ruff check src test --statistics >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ruff check src test --statistics || true

  # Single aggregate check for branch protection to require. Without this, the
  # required-checks list has to name every matrix leg by its rendered job name
  # and needs editing each time the matrix changes.
  #
  # Note this depends only on `test`: the advisory quality job is intentionally
  # excluded, so lint or type findings can never block a merge.
  gate:
    name: tests-passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    if: always()
    steps:
      - name: Verify the matrix succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Test matrix result: ${{ needs.test.result }}"
            exit 1
          fi
          echo "All matrix legs passed."
