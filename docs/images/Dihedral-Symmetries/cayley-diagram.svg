<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Cayley diagram for the dihedral group D3</title>
  <desc id="desc">Two nested triangles represent the six matrices. Both directed cycles use A equals BJ, but circulate in opposite visual directions. Dashed links between corresponding vertices are labelled J.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#edf2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1a202c" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 28px 'Segoe UI', sans-serif; fill: #1a202c; }
      .subtitle { font: 16px 'Segoe UI', sans-serif; fill: #4a5568; }
      .section { font: 700 17px 'Segoe UI', sans-serif; fill: #2d3748; letter-spacing: 0.5px; }
      .node-text { font: 700 24px 'Segoe UI', sans-serif; fill: #1a202c; text-anchor: middle; dominant-baseline: middle; }
      .edge-label { font: 700 16px 'Segoe UI', sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .legend { font: 15px 'Segoe UI', sans-serif; fill: #4a5568; }
    </style>
  </defs>

  <rect width="960" height="560" rx="24" fill="url(#bg)"/>
  <text x="480" y="52" class="title" text-anchor="middle">Cayley diagram of D₃</text>
  <text x="480" y="80" class="subtitle" text-anchor="middle">right multiplication by the two generators B and J</text>

  <text x="480" y="122" class="section" text-anchor="middle">A-cycles in opposite orientations</text>

  <!-- Reflection edges are drawn first so the directed triangles sit above them. -->
  <g fill="none" stroke="#718096" stroke-width="2.5" stroke-dasharray="8 7" opacity="0.9">
    <path d="M480 202 L480 238"/>
    <path d="M240 416 L320 390"/>
    <path d="M720 416 L640 390"/>
  </g>
  <g class="edge-label" fill="#4a5568">
    <rect x="490" y="208" width="20" height="24" rx="8" fill="#edf2f7"/>
    <text x="500" y="220">J</text>
    <rect x="280" y="390" width="20" height="24" rx="8" fill="#edf2f7"/>
    <text x="290" y="402">J</text>
    <rect x="660" y="390" width="20" height="24" rx="8" fill="#edf2f7"/>
    <text x="670" y="402">J</text>
  </g>

  <!-- Outer triangle: I -> A -> D -> I. -->
  <g fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)">
    <path d="M510 178 L735 416"/>
    <path d="M730 445 L230 445"/>
    <path d="M225 416 L450 178"/>
  </g>
  <g class="edge-label" fill="#1d4ed8">
    <rect x="330" y="290" width="24" height="24" rx="8" fill="#dbeafe"/>
    <text x="342" y="302">A</text>
    <rect x="468" y="433" width="24" height="24" rx="8" fill="#dbeafe"/>
    <text x="480" y="445">A</text>
    <rect x="606" y="290" width="24" height="24" rx="8" fill="#dbeafe"/>
    <text x="618" y="302">A</text>
  </g>

  <!-- Inner triangle: J -> C -> B -> J. -->
  <g fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)">
    <path d="M460 295 L375 365"/>
    <path d="M385 390 L575 390"/>
    <path d="M585 365 L500 295"/>
  </g>
  <g class="edge-label" fill="#1d4ed8">
    <rect x="404" y="308" width="24" height="24" rx="8" fill="#dbeafe"/>
    <text x="416" y="320">A</text>
    <rect x="468" y="378" width="24" height="24" rx="8" fill="#dbeafe"/>
    <text x="480" y="390">A</text>
    <rect x="532" y="308" width="24" height="24" rx="8" fill="#dbeafe"/>
    <text x="544" y="320">A</text>
  </g>

  <!-- Nodes. -->
  <g filter="url(#shadow)" stroke-width="3">
    <circle cx="480" cy="160" r="42" fill="#ffffff" stroke="#2563eb"/>
    <circle cx="200" cy="445" r="42" fill="#ffffff" stroke="#2563eb"/>
    <circle cx="760" cy="445" r="42" fill="#ffffff" stroke="#2563eb"/>
    <circle cx="480" cy="270" r="32" fill="#ffffff" stroke="#2563eb"/>
    <circle cx="350" cy="390" r="32" fill="#ffffff" stroke="#2563eb"/>
    <circle cx="610" cy="390" r="32" fill="#ffffff" stroke="#2563eb"/>
  </g>
  <g class="node-text">
    <text x="480" y="160">I</text>
    <text x="200" y="445">D</text>
    <text x="760" y="445">A</text>
    <text x="480" y="270">J</text>
    <text x="610" y="390">B</text>
    <text x="350" y="390">C</text>
  </g>

  <g class="legend">
    <line x1="180" y1="510" x2="220" y2="510" stroke="#2563eb" stroke-width="4"/>
    <text x="230" y="515">A = BJ: both cycles, opposite orientations</text>
    <line x1="580" y1="510" x2="620" y2="510" stroke="#718096" stroke-width="2.5" stroke-dasharray="8 7"/>
    <text x="630" y="515">J: reflection links</text>
  </g>
</svg>
